; Ofelia в контейнере scheduler: каталог стека смонтирован в /stack.

[job-exec "lireate-seo-unlighthouse-weekly"]
schedule = 0 3 * * 0
no-overlap = true
command = sh -c "cd /stack && bash vps/run-audit-all.sh unlighthouse"

[job-exec "lireate-seo-siteone-weekly"]
schedule = 0 4 * * 1
no-overlap = true
command = sh -c "cd /stack && bash vps/run-audit-all.sh siteone"

[job-exec "lireate-seo-indexlift-daily"]
schedule = 0 5 * * *
no-overlap = true
command = sh -c "cd /stack && bash vps/run-audit-all.sh indexlift"

[job-exec "lireate-seo-github-dispatch"]
schedule = 0 6 * * 2
no-overlap = true
command = sh -c "cd /stack && bash vps/agent/dispatch-github-fix.sh"